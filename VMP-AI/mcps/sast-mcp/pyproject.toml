[project]
name = "sast-mcp-server"
version = "0.8.3"
description = "A standard MCP server for SAST/DAST tools (Bandit, njsscan, Bearer, Semgrep, Trivy, CodeQL, Checkov, Gitleaks, OSV-Scanner, Grype, OWASP ZAP) — scan code for security vulnerabilities from any AI agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Abdellah"},
]
keywords = ["mcp", "sast", "security", "bandit", "bearer", "njsscan", "semgrep", "trivy", "codeql", "checkov", "sarif", "ai-agent", "gemini-cli", "oauth", "baseline", "cache", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
]

[project.optional-dependencies]
typescript = [
    "tree-sitter-typescript>=0.21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]
auth = [
    "pyjwt>=2.0.0",
]
pdf = [
    "reportlab>=4.0",
]
# pip-installable scanners — one command to get a working multi-scanner setup.
# The binary scanners (trivy, grype, gitleaks, osv-scanner) and CodeQL/ZAP are
# not pip packages; use the full Docker image or install them per their docs.
scanners = [
    "bandit>=1.7",
    "njsscan>=0.3",
    "semgrep>=1.0",
    "checkov>=3.0",
]
all = [
    "sast-mcp-server[typescript,dev,auth,pdf,scanners]",
]

[project.scripts]
sast-mcp-server = "sast_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/Skyrxin/sast-mcp-server"
Repository = "https://github.com/Skyrxin/sast-mcp-server"
Issues = "https://github.com/Skyrxin/sast-mcp-server/issues"
Documentation = "https://github.com/Skyrxin/sast-mcp-server#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sast_mcp_server"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

# reportlab (optional [pdf] extra) ships no type stubs.
[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true
