services:
  postgres:
    image: pgvector/pgvector:pg17
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: app
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: app
    ports:
      - "3307:3306"

  redis:
    image: redis:8
    ports:
      - "6380:6379"

  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"

  atlas:
    image: mongodb/mongodb-atlas-local:8.0
    profiles: ["atlas"]
    ports:
      - "27018:27017"
