agent:
    api_max_retries: 2
    build_wait_timeout: 600
    clarify_timeout: 3600
    coding_context: auto
    environment_probe: true
    execution_guidance: true
    gateway_notify_interval: 120
    gateway_timeout: 1800
    gateway_timeout_warning: 900
    intent_ack_continuation: true
    parallel_tool_call_guidance: true
    reasoning_echo: false
    reasoning_effort: ultra
    reasoning_overrides:
        claude-opus: ultra
        claude-sonnet: ultra
        gemini: max
        gpt-5: ultra
    service_tier: ""
    session_stall_timeout: 300
    stall_guards: true
    task_completion_guidance: true
    tool_use_enforcement: true
    verify_guidance: true
    verify_on_stop: false
approvals:
    cron_mode: deny
    denial_breaker_threshold: 3
    deny:
        - rm -rf /*
        - rm -rf ~/*
        - git push --force *
        - git push -f *
        - format c:*
        - mkfs*
        - dd if=* of=/dev/*
        - shutdown *
        - reboot *
    destructive_slash_confirm: true
    mcp_reload_confirm: true
    mode: smart
    single_query_mode: deny
    timeout: 300
auxiliary:
    approval:
        model: ""
        provider: auto
        reasoning_effort: medium
        timeout: 30
    background_review:
        enabled: true
        max_input_tokens: 800000
        model: ""
        provider: auto
        reasoning_effort: high
        timeout: 180
    compression:
        model: ""
        provider: auto
        reasoning_effort: high
        timeout: 180
    curator:
        model: ""
        provider: auto
        reasoning_effort: high
        timeout: 600
    free_only: true
    kanban_decomposer:
        model: ""
        provider: auto
        reasoning_effort: high
        timeout: 180
    monitor:
        model: ""
        provider: auto
        reasoning_effort: medium
        timeout: 60
    openrouter_model: ""
    review:
        model: ""
        provider: auto
        timeout: 300
    title_generation:
        enabled: true
        model: ""
        prefer_fast_model: false
        provider: auto
        reasoning_effort: low
        timeout: 30
    transient_retries: 3
    triage_specifier:
        model: ""
        provider: auto
        reasoning_effort: high
        timeout: 120
    vision:
        model: gemini-3.8-flash
        provider: gemini
        reasoning_effort: high
        timeout: 120
browser:
    allow_private_urls: false
    backend: ""
    engine: auto
    headed: false
    record_sessions: false
    snapshot_threshold: 15000
checkpoints:
    auto_prune: true
    enabled: true
    max_file_size_mb: 10
    max_snapshots: 20
    max_total_size_mb: 500
    min_interval_hours: 24
    retention_days: 7
compression:
    codex_gpt55_autoraise: true
    enabled: true
    in_place: true
    protect_first_n: 3
    protect_last_n: 20
    target_ratio: 0.2
    threshold: 0.5
context_file_max_chars: 400000
cron:
    allow_agent_scheduling: false
    max_parallel_jobs: 3
    media_send_timeout: 300
    mirror_delivery: false
    model_drift_guard: true
    preflight: true
    script_timeout_seconds: 3600
    wrap_response: true
curator:
    archive_after_days: 30
    archive_ttl_days: 0
    backup:
        enabled: true
        keep: 10
    consolidate: true
    enabled: true
    interval_hours: 24
    min_idle_hours: 1
    prune_builtins: true
    stale_after_days: 14
delegation:
    child_timeout_seconds: 900
    inherit_mcp_toolsets: true
    max_concurrent_children: 6
    max_iterations: 500
    max_spawn_depth: 3
    orchestrator_enabled: true
    reasoning_effort: ultra
    subagent_auto_approve: false
display:
    background_process_notifications: concise
    battery: false
    busy_input_mode: interrupt
    cli_multiline_shortcuts: true
    cli_refresh_interval: 1
    compact: false
    file_mutation_verifier: true
    final_response_markdown: strip
    friendly_tool_labels: true
    inline_diffs: true
    interface: tui
    language: en
    memory_notifications: "on"
    reasoning_full: false
    resume_display: full
    resume_exchanges: 10
    show_cost: false
    show_reasoning: true
    skin: default
    spinner_token_flow: true
    streaming: true
    timestamp_format: '%H:%M'
    timestamps: true
    tool_preview_length: 0
    tool_progress: true
    tool_progress_grouping: accumulate
    tui_agents_nudge: true
    tui_auto_resume_recent: true
    tui_status_indicator: kaomoji
    turn_summary: true
fallback_model:
    - model: gpt-4.1
      provider: copilot
    - model: gpt-4o
      provider: copilot
    - model: gpt-4o-mini
      provider: copilot
    - model: gemini-3.8-flash
      provider: gemini
    - model: qwen2.5-coder:32b
      provider: ollama-local
    - model: qwen2.5-coder-14b-instruct
      provider: lmstudio-local
file_read_max_chars: 400000
gateway:
    delivery_ledger: true
    loop_watchdog: true
    max_inbound_media_bytes: 134217728
    platform_connect_timeout: 30
    respawn_storm:
        max: 5
        window: 120
    restart_loop_guard:
        max_gap: 300
        max_restarts: 3
        window: 60
    scale_to_zero:
        idle_timeout_minutes: 2
    strict: false
    trust_recent_files: true
    trust_recent_files_seconds: 600
    write_sessions_json: true
kanban:
    auto_decompose: true
    auto_decompose_per_tick: 3
    auto_subscribe_on_create: true
    dispatch_in_gateway: true
    dispatch_interval_seconds: 60
    dispatch_stale_timeout_seconds: 14400
    done_sub_retention_days: 30
    failure_limit: 2
    max_in_progress: 4
    max_in_progress_per_profile: 2
    reconcile_orphans: true
    review_dispatch: true
memory:
    memory_char_limit: 5000
    memory_enabled: true
    nudge_interval: 5
    provider: holographic
    user_char_limit: 3000
    user_profile_enabled: true
    write_approval: false
model:
    api_key: ollama
    base_url: http://127.0.0.1:11434/v1
    default: dcostenco/prism-coder:2b
    provider: ollama-launch
openrouter:
    response_cache: true
    response_cache_ttl: 300
prompt_caching:
    cache_ttl: 5m
providers:
    cerebras:
        api_mode: chat_completions
        base_url: https://api.cerebras.ai/v1
    google:
        api_mode: chat_completions
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
    groq:
        api_mode: chat_completions
        base_url: https://api.groq.com/openai/v1
    inferx:
        api_mode: chat_completions
        base_url: https://api.inferx.net/v1
    lmstudio-local:
        api_mode: chat_completions
        base_url: http://127.0.0.1:1234/v1
    nvidia:
        api_mode: chat_completions
        base_url: https://integrate.api.nvidia.com/v1
    ollama-launch:
        api: http://127.0.0.1:11434/v1
        default_model: dcostenco/prism-coder:2b
        models:
            - dcostenco/prism-coder:2b
            - llama3.2:latest
            - qwen3.5:4b
        name: Ollama
    ollama-local:
        api_mode: chat_completions
        base_url: http://127.0.0.1:11434/v1
    omniroute:
        api_mode: chat_completions
        base_url: http://127.0.0.1:20128/v1
    together:
        api_mode: chat_completions
        base_url: https://api.together.xyz/v1
    zai:
        api_mode: chat_completions
        base_url: https://api.z.ai/api/paas/v4
security:
    allow_lazy_installs: false
    allow_private_urls: false
    approvals:
        mode: smart
        timeout: 300
    protected_instruction_files: true
    redact_pii: false
    redact_secrets: true
    tirith_enabled: true
    tirith_fail_open: true
    tirith_timeout: 5
sync:
    opencode_env: true
terminal:
    auto_source_bashrc: true
    backend: local
    container_disk: 51200
    container_memory: 5120
    container_persistent: true
    degraded_mode: warn
    docker_image: nikolaik/python-nodejs:python3.11-nodejs20
    docker_network: true
    docker_shm_size: 1g
    env_passthrough: []
    home_mode: auto
    persistent_shell: true
    timeout: 180
tool_loop_guardrails:
    hard_stop_enabled: false
    loop_caps:
        max_subagents: 50
        max_web_searches: 50
    warnings_enabled: true
tool_output:
    max_bytes: 150000
    max_line_length: 4000
    max_lines: 4000
toolsets:
    - hermes-cli
    - web
